# ===== SERVER CONFIGURATION =====
server.port=8080
server.servlet.context-path=/

# ===== APPLICATION INFORMATION =====
spring.application.name=Sentinel AI POC
app.version=1.0.0
app.description=AI-powered silent failure detection and operational intelligence platform

# ===== DATABASE CONFIGURATION =====
# Using H2 in-memory for quick demo (can be changed to PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10

# ===== ELASTICSEARCH CONFIGURATION =====
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.socket-timeout=60000
spring.elasticsearch.connection-timeout=1000

# ===== KAFKA CONFIGURATION =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ===== LOGGING CONFIGURATION =====
logging.level.root=INFO
logging.level.com.example.sentinalAI=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===== SPRINGDOC OPENAPI (SWAGGER) =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ===== AI PROVIDER =====
# Options: ollama | gemini
ai.provider=ollama

# ===== OLLAMA (Local LLM) =====
# Make sure Ollama is running: ollama serve
# Model must be pulled: ollama pull mistral
ollama.base-url=http://localhost:11434
ollama.model=mistral
ollama.max-tokens=1024
ollama.temperature=0.2
ollama.connect-timeout=5000
ollama.read-timeout=180000

# ===== HUGGINGFACE (legacy - not used) =====
huggingface.api-url=http://localhost:11434/v1/chat/completions
huggingface.api-token=ollama
huggingface.model=mistral
huggingface.max-tokens=1500
huggingface.temperature=0.3
huggingface.connect-timeout=10000
huggingface.read-timeout=180000

# ===== GOOGLE GEMINI (disabled) =====
google.gemini.api-key=
google.gemini.model=gemini-2.0-flash
google.gemini.max-tokens=2048
google.gemini.temperature=0.3
